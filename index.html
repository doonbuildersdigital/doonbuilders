<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doon Builders | Infrastructure &amp; Construction Since 1968</title>
    <meta
      name="description"
      content="Doon Builders is a three-generation construction and infrastructure company with experience across government infrastructure, roads, bridges, dams, hospitality, healthcare and private development."
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Apply the saved (or device) colour theme before first paint to avoid a flash. Mirrors src/lib/theme.js. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('db-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#181a1d');
      })();
    </script>
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
